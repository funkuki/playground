<!doctype html>
<meta charset="utf-8">
<title>Boat Layer Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1f20; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// 第一幕划船的 2D 紙偶場景（src/boat2d.js）單獨播放；?book 看書頁插圖版
import { boatScene } from '../src/boat2d.js';

const book = new URLSearchParams(location.search).has('book');
const c = document.getElementById('c'), g = c.getContext('2d');
const S = boatScene({ base: './', book });
const FPS = 24;
const draw = (t) => {
  const v = S.draw(t);
  g.fillStyle = book ? '#e8dcc0' : '#000';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(v, 0, 0);
};
window.__test = { ready: S.ready, draw, frames: FPS * S.loop, fps: FPS, canvas: c };
if (!/render/.test(location.search)) S.ready.then(() => {
  const t0 = performance.now();
  const loop = (now) => { draw((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
